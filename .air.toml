# macOS 開発用（既定）。Windows では .air.toml.win を .air.toml にコピーして利用。
[misc]
  # 終了時に一時ファイルを削除
  clean_on_exit = true

[build]
  root = "."
  include_ext = ["go", "tpl", "tmpl", "html", "js", "ts", "css"]
  # 起動前にTailwindをビルド + vendorコピー
  pre_cmd = ["bun run --cwd frontend build"]
  include_dir=[]
  include_file = ["frontend/package.json", "./.env", "./.air.toml", "./cmd/app/main.go", "templates/**/*.html", "static/js/app/**", "frontend/tailwind.config.js"]
  exclude_dir = ["frontend/node_modules", "static/vendor"]
  # Goのビルド
  cmd = "go build -o ./tmp/main cmd/app/main.go"
  kill_delay = 0
  poll = true
  poll_interval = 500
  return = false
  return_delay = 0
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"