{{ define "header" }}
<header class="sticky top-0 z-30 flex h-16 items-center gap-3 border-b border-base-300 bg-base-100 px-4 md:px-6">
    <button type="button" class="btn btn-ghost btn-sm btn-square border border-base-300"
        @click="$store.ui.toggleSidebar()" aria-label="サイドバーを開閉">
        <i data-lucide="panel-left" class="h-5 w-5"></i>
    </button>
    <nav class="flex items-center gap-2 text-sm text-base-content/60">
        <a href="/" class="hover:text-base-content">ホーム</a>
        {{ if .Breadcrumb }}<i data-lucide="chevron-right" class="h-4 w-4"></i><span
            class="font-medium text-base-content">{{ .Breadcrumb }}</span>{{ end }}
    </nav>
    <div class="ml-auto">
        <div class="dropdown dropdown-end">
            <button type="button" tabindex="0" class="btn btn-ghost btn-sm gap-2 rounded-full border border-base-300">
                <span class="grid h-7 w-7 place-items-center rounded-full bg-rose-900 text-xs font-semibold text-white">
                    {{ if .User.Name }}{{ printf "%.1s" .User.Name }}{{ else }}?{{ end }}
                </span>
                <span class="hidden sm:inline">{{ .User.Name }}</span>
                <i data-lucide="chevron-down" class="h-4 w-4 opacity-60"></i>
            </button>
            <ul tabindex="0" class="menu dropdown-content z-50 mt-2 w-52 rounded-box border border-base-300 bg-base-100 p-2 shadow-lg">
                <li><a href="/setting"><i data-lucide="user" class="h-4 w-4"></i>プロフィール</a></li>
                <li><a href="/logout"><i data-lucide="log-out" class="h-4 w-4"></i>ログアウト</a></li>
            </ul>
        </div>
    </div>
</header>
{{ end }}
